<svg width="340" height="240" viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .window-bar { fill: #1c1c2e; }
      .screen     { fill: #0D1117; }
      .dot-r      { fill: #ff5f56; }
      .dot-y      { fill: #ffbd2e; }
      .dot-g      { fill: #27c93f; }
      .prompt     { font-family: 'Courier New', monospace; font-size: 12px; fill: #8B5CF6; }
      .cmd        { font-family: 'Courier New', monospace; font-size: 12px; fill: #C9D1D9; }
      .output     { font-family: 'Courier New', monospace; font-size: 11px; fill: #6EE7B7; }
      .comment    { font-family: 'Courier New', monospace; font-size: 11px; fill: #4B5563; }
      .cursor     { fill: #8B5CF6; animation: blink 1s step-end infinite; }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }

      /* line-by-line fade-in */
      .l1 { animation: fadeIn 0.5s ease 0.2s both; }
      .l2 { animation: fadeIn 0.5s ease 0.9s both; }
      .l3 { animation: fadeIn 0.5s ease 1.4s both; }
      .l4 { animation: fadeIn 0.5s ease 1.8s both; }
      .l5 { animation: fadeIn 0.5s ease 2.3s both; }
      .l6 { animation: fadeIn 0.5s ease 2.8s both; }
      .l7 { animation: fadeIn 0.5s ease 3.3s both; }
      .l8 { animation: fadeIn 0.5s ease 3.8s both; }
      @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    </style>
  </defs>

  <!-- Window frame -->
  <rect width="340" height="240" rx="10" class="window-bar"/>

  <!-- Title bar -->
  <rect width="340" height="30" rx="10" class="window-bar"/>
  <rect y="20" width="340" height="10" class="window-bar"/>
  <circle cx="18" cy="15" r="5" class="dot-r"/>
  <circle cx="34" cy="15" r="5" class="dot-y"/>
  <circle cx="50" cy="15" r="5" class="dot-g"/>
  <text x="170" y="20" font-family="'Segoe UI', Arial" font-size="11" fill="#555" text-anchor="middle">aditya@dev ~ terminal</text>

  <!-- Screen area -->
  <rect y="30" x="0" width="340" height="210" rx="0" class="screen"/>
  <rect y="220" x="0" width="340" height="20" rx="0" class="screen"/>
  <rect y="220" x="0" width="340" height="20" class="screen"/>
  <rect y="230" x="0" width="340" height="10" rx="10" class="screen"/>

  <!-- Terminal content -->
  <g class="l1">
    <text x="14" y="56" class="prompt">❯</text>
    <text x="26" y="56" class="cmd">python ai_model.py</text>
  </g>
  <g class="l2">
    <text x="14" y="74" class="output">✓ Model loaded successfully</text>
  </g>
  <g class="l3">
    <text x="14" y="90" class="output">✓ Training data: 10,000 samples</text>
  </g>
  <g class="l4">
    <text x="14" y="112" class="prompt">❯</text>
    <text x="26" y="112" class="cmd">git commit -m "feat: new AI feature"</text>
  </g>
  <g class="l5">
    <text x="14" y="130" class="output">✓ 3 files changed, 142 insertions</text>
  </g>
  <g class="l6">
    <text x="14" y="152" class="prompt">❯</text>
    <text x="26" y="152" class="cmd">npm run dev</text>
  </g>
  <g class="l7">
    <text x="14" y="170" class="output">✓ Local: http://localhost:5173</text>
  </g>
  <g class="l8">
    <text x="14" y="192" class="prompt">❯</text>
    <text x="26" y="192" class="comment"># Always learning, always building...</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="14" y="205" width="8" height="14" rx="1" class="cursor"/>
</svg>
