<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="barGenAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5B21B6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="barML" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6D28D9"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="barPy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4338CA"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    <linearGradient id="barDB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5B21B6"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="barFS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3730A3"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="barAIApp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#9333EA"/>
    </linearGradient>
    <style>
      .bar-track { fill: #1e1b4b; rx: 6; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #C9D1D9; }
      .pct   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #E9D5FF; }
      .level { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #8B5CF6; }

      #b1 { animation: grow70 1.4s ease-out both; }
      #b2 { animation: grow65 1.5s ease-out 0.1s both; }
      #b3 { animation: grow50 1.5s ease-out 0.2s both; }
      #b4 { animation: grow70 1.4s ease-out 0.15s both; }
      #b5 { animation: grow70 1.4s ease-out 0.2s both; }
      #b6 { animation: grow65 1.5s ease-out 0.25s both; }
      #b7 { animation: grow45 1.5s ease-out 0.3s both; }

      @keyframes grow70 { from { width: 0 } to { width: 336px } }
      @keyframes grow65 { from { width: 0 } to { width: 312px } }
      @keyframes grow50 { from { width: 0 } to { width: 240px } }
      @keyframes grow45 { from { width: 0 } to { width: 216px } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="#0D1117" rx="12"/>

  <!-- Title -->
  <text x="400" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#8B5CF6" text-anchor="middle" letter-spacing="2">AI / ML EXPERTISE</text>

  <!-- Row 1: AI -->
  <text class="label" x="20" y="68">🧠 Artificial Intelligence</text>
  <text class="pct" x="780" y="68" text-anchor="end">70%</text>
  <rect x="20" y="74" width="480" height="10" rx="5" fill="#1e1b4b"/>
  <rect id="b1" x="20" y="74" width="336" height="10" rx="5" fill="url(#barAI)"/>
  <text class="level" x="510" y="83">Intermediate</text>

  <!-- Row 2: Gen AI -->
  <text class="label" x="20" y="112">✨ Generative AI</text>
  <text class="pct" x="780" y="112" text-anchor="end">65%</text>
  <rect x="20" y="118" width="480" height="10" rx="5" fill="#1e1b4b"/>
  <rect id="b2" x="20" y="118" width="312" height="10" rx="5" fill="url(#barGenAI)"/>
  <text class="level" x="510" y="127">Intermediate</text>

  <!-- Row 3: ML -->
  <text class="label" x="20" y="156">📊 Machine Learning</text>
  <text class="pct" x="780" y="156" text-anchor="end">50%</text>
  <rect x="20" y="162" width="480" height="10" rx="5" fill="#1e1b4b"/>
  <rect id="b3" x="20" y="162" width="240" height="10" rx="5" fill="url(#barML)"/>
  <text class="level" x="510" y="171">Beginner–Intermediate</text>

  <!-- Row 4: AI App Dev -->
  <text class="label" x="20" y="200">🏗️ AI Application Dev</text>
  <text class="pct" x="780" y="200" text-anchor="end">70%</text>
  <rect x="20" y="206" width="480" height="10" rx="5" fill="#1e1b4b"/>
  <rect id="b4" x="20" y="206" width="336" height="10" rx="5" fill="url(#barAIApp)"/>
  <text class="level" x="510" y="215">Intermediate</text>

  <!-- Row 5: Python -->
  <text class="label" x="20" y="244">🐍 Python</text>
  <text class="pct" x="780" y="244" text-anchor="end">70%</text>
  <rect x="20" y="250" width="480" height="10" rx="5" fill="#1e1b4b"/>
  <rect id="b5" x="20" y="250" width="336" height="10" rx="5" fill="url(#barPy)"/>
  <text class="level" x="510" y="259">Intermediate</text>

  <!-- Row 6: Databases -->
  <text class="label" x="20" y="288">🗄️ Databases (SQL &amp; NoSQL)</text>
  <text class="pct" x="780" y="288" text-anchor="end">65%</text>
  <rect x="20" y="294" width="480" height="10" rx="5" fill="#1e1b4b"/>
  <rect id="b6" x="20" y="294" width="312" height="10" rx="5" fill="url(#barDB)"/>
  <text class="level" x="510" y="303">Intermediate</text>
</svg>
